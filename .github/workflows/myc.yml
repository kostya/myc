name: myc

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  QBE_SHA: "fab6d40620ac8e23fa42cc9b945688ca5edeb091"
  CPPGM: "0.9.6"
  INDEX_C_SHA: "019ddd8f9c4b2cac7d0512ebbf78d5b28aff63f5"

jobs:
  spec:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        backend: [ llvm, qbe, c, gm ]
        cc: [ clang, gcc ]
        exclude:
          - { backend: llvm, cc: gcc }
          - { backend: gm, cc: gcc }
          - { backend: qbe, cc: gcc }
          - { os: macos-latest, cc: gcc }
          - { os: macos-latest, backend: gm }
          - { os: macos-latest, backend: qbe }
          - { os: macos-latest, backend: c }
          
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: shards-${{ runner.os }}-${{ hashFiles('shard.lock') }}
          restore-keys: |
            shards-${{ runner.os }}-

      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-22-dev

      - name: Configure LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          LLVM_PREFIX=$(brew --prefix llvm 2>/dev/null || true)
          if [ -z "$LLVM_PREFIX" ] || [ ! -x "$LLVM_PREFIX/bin/llvm-config" ]; then
            LLVM_PREFIX=$(brew --prefix llvm@20 2>/dev/null || true)
          fi
          if [ -z "$LLVM_PREFIX" ] || [ ! -x "$LLVM_PREFIX/bin/llvm-config" ]; then
            LLVM_PREFIX=$(brew --prefix llvm@18 2>/dev/null || true)
          fi
          if [ -n "$LLVM_PREFIX" ] && [ -x "$LLVM_PREFIX/bin/llvm-config" ]; then
            echo "LLVM_CONFIG=$LLVM_PREFIX/bin/llvm-config" >> $GITHUB_ENV
          else
            brew install llvm
            echo "LLVM_CONFIG=$(brew --prefix llvm)/bin/llvm-config" >> $GITHUB_ENV
          fi

      - name: Shards install
        run: shards install

      - name: Restore QBE cache
        if: contains(matrix.backend, 'qbe')
        id: qbe-cache
        uses: actions/cache@v4
        with:
          path: plugins/qbe
          key: qbe-${{ runner.os }}-${{ env.QBE_SHA }}

      - name: Clone and build QBE (skip if cached)
        if: contains(matrix.backend, 'qbe') && steps.qbe-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/kostya/qbe.git plugins/qbe
          cd plugins/qbe
          git checkout ${{ env.QBE_SHA }}
          make

      - name: Restore cppgm cache
        if: contains(matrix.backend, 'gm')
        id: cppgm-cache
        uses: actions/cache@v4
        with:
          path: plugins/cppgm
          key: cppgm-new-${{ runner.os }}-${{ env.CPPGM }}

      - name: Download the cppgm release (skip if cached)
        if: contains(matrix.backend, 'gm') && steps.cppgm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p plugins/cppgm

          if [ "${{ runner.os }}" = "Linux" ]; then
            ARCHIVE="cppgm-v${{ env.CPPGM }}-linux-x86_64.tar.gz"
            URL="https://github.com/vishvananda/cppgm/releases/download/v${{ env.CPPGM }}/${ARCHIVE}"
            wget -qO- "$URL" | tar -xz -C plugins/cppgm --strip-components=1
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ARCHIVE="cppgm-v${{ env.CPPGM }}-macos-x86_64.tar.gz"
            URL="https://github.com/vishvananda/cppgm/releases/download/v${{ env.CPPGM }}/${ARCHIVE}"
            curl -fsSL "$URL" | tar -xz -C plugins/cppgm --strip-components=1
          fi

      - name: Restore INDEX-C cache
        id: index-c-cache
        uses: actions/cache@v4
        with:
          path: plugins/index-c
          key: index-c-${{ runner.os }}-${{ env.INDEX_C_SHA }}

      - name: Clone and build INDEX-C (skip if cached)
        if: steps.index-c-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/kostya/index-c.git plugins/index-c
          cd plugins/index-c
          git checkout ${{ env.INDEX_C_SHA }}

      - name: Run specs
        env:
          BACKEND: ${{ matrix.backend }}
          CC: ${{ matrix.cc }}
          GM_LIBRARY: /not-installed/cppgm-lowir
        run: |
          if [ "${{ matrix.backend }}" = gm ]; then
            gm_lib="$GITHUB_WORKSPACE/plugins/cppgm/lib/libcppgm_lowir.a"
            crystal spec -Dgm_static --link-flags "$gm_lib -lstdc++ -pthread"
          else
            crystal spec
          fi
      
      - name: Fast test index.c compile and checksums
        env:
          CC: ${{ matrix.cc }}
          TEST: "1"
        run: |
          crystal src/cli/mycc.cr --backend ${{ matrix.backend }} plugins/index-c/index.c r
          crystal src/cli/mycc.cr --backend ${{ matrix.backend }} plugins/index-c/index.c r --final
          crystal src/cli/mycc.cr --backend ${{ matrix.backend }} plugins/index-c/index.c r --debug

