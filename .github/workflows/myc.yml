name: myc

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  QBE_SHA: "fab6d40620ac8e23fa42cc9b945688ca5edeb091"

jobs:
  spec:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04, macos-latest ]
        backend: [ "llvm,qbe", c ]
        cc: [ clang, gcc ]
        exclude:
          - { backend: "llvm,qbe", cc: gcc }
          - { os: macos-latest, cc: gcc }

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: shards-${{ runner.os }}-${{ hashFiles('shard.lock') }}
          restore-keys: |
            shards-${{ runner.os }}-

      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-22-dev

      - name: Configure LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          LLVM_PREFIX=$(brew --prefix llvm 2>/dev/null || true)
          if [ -z "$LLVM_PREFIX" ] || [ ! -x "$LLVM_PREFIX/bin/llvm-config" ]; then
            LLVM_PREFIX=$(brew --prefix llvm@20 2>/dev/null || true)
          fi
          if [ -z "$LLVM_PREFIX" ] || [ ! -x "$LLVM_PREFIX/bin/llvm-config" ]; then
            LLVM_PREFIX=$(brew --prefix llvm@18 2>/dev/null || true)
          fi
          if [ -n "$LLVM_PREFIX" ] && [ -x "$LLVM_PREFIX/bin/llvm-config" ]; then
            echo "LLVM_CONFIG=$LLVM_PREFIX/bin/llvm-config" >> $GITHUB_ENV
          else
            brew install llvm
            echo "LLVM_CONFIG=$(brew --prefix llvm)/bin/llvm-config" >> $GITHUB_ENV
          fi

      - name: Shards install
        run: shards install

      - name: Restore QBE cache
        if: contains(matrix.backend, 'qbe')
        id: qbe-cache
        uses: actions/cache@v4
        with:
          path: plugins/qbe
          key: qbe-${{ runner.os }}-${{ env.QBE_SHA }}

      - name: Clone and build QBE (skip if cached)
        if: contains(matrix.backend, 'qbe') && steps.qbe-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/kostya/qbe.git plugins/qbe
          cd plugins/qbe
          git checkout ${{ env.QBE_SHA }}
          make

      - name: Run specs
        env:
          BACKEND: ${{ matrix.backend }}
          CC: ${{ matrix.cc }}
        run: crystal spec
